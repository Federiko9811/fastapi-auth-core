services:
  app-api:
    build: .
    container_name: app_api
    restart: always
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    # Wait for the database and redis to be ready before starting
    depends_on:
      - db
      - redis

  # Database Service (internal only - access via Portainer console)
  db:
    image: postgres:17-alpine
    container_name: app_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Service (internal only - access via Portainer console)
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: always
    volumes:
      - redis_data:/data

# Named volumes for data persistence
volumes:
  postgres_data:
  redis_data:
